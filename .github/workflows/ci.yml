name: CI

# 只做"不需要大模型"的检查：lint、格式、迁移可执行、单元测试。
# 端到端冒烟要真调模型（花钱、受网络影响），放在本地与发布前手动跑。
on:
  push:
    branches: [main]
    paths: ["src/**", ".github/**"]
  pull_request:
    paths: ["src/**", ".github/**"]

defaults:
  run:
    working-directory: src

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # 测试用的假配置：不连真实模型、不连生产库
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
      JWT_SECRET: ci-only-secret-not-for-production-use-32chars
      APP_ENV: dev
      LLM_PROVIDER: mock
      EMBED_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements*.txt

      - name: 安装依赖
        run: pip install -r requirements-dev.txt

      - name: 静态检查
        run: ruff check .

      - name: 格式一致性
        run: ruff format --check .

      - name: 迁移能从零建库
        run: alembic upgrade head

      - name: 单元测试 + 覆盖率闸门
        # --cov-fail-under 与 pyproject 的 fail_under 同值：覆盖率掉了直接让 CI 红，
        # 而不是等评审时才发现"测试越写越少"
        run: pytest --cov --cov-report=term-missing --cov-fail-under=55

      - name: 应用可导入（捕获启动期错误）
        run: python -c "from app.main import app; print('routes:', len(app.routes))"
