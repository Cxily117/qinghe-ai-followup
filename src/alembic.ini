[alembic]
script_location = alembic
prepend_sys_path = .
# NOTE: keep this file ASCII-only. configparser reads it with locale encoding
# (GBK on zh-CN Windows) and non-ASCII comments break parsing.
# The real URL is injected in alembic/env.py from app.core.config.Settings.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
