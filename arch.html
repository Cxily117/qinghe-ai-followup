<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随访系统架构图</title>
<style>body{margin:0;background:#fff;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#1F2329}
.wrap{max-width:1000px;margin:0 auto;padding:20px}
h2{font-size:18px;margin:0 0 8px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:#5A6573;margin:6px 0 4px}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:middle}
svg{display:block;margin:0 auto;max-width:100%}</style></head>
<body><div class="wrap">
<h2>门诊后随访辅助系统 · 总体架构</h2>
<div class="legend">
  <span><span class="dot" style="background:#2F6BFF"></span>数据/AI/应用/合规 四层</span>
  <span><span class="dot" style="background:#1FA971"></span>人工协同层（硬关卡）</span>
  <span><span class="dot" style="background:#E08A2B"></span>运营度量层（效果结算）</span>
</div>
<svg viewBox="0 0 980 660" xmlns="http://www.w3.org/2000/svg" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#5A6573"/></marker></defs>

  <!-- left vertical flow arrow -->
  <g stroke="#9AA4B2" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <line x1="30" y1="80" x2="30" y2="520"/>
  </g>
  <text x="30" y="300" font-size="11" fill="#5A6573" transform="rotate(-90 30 300)" text-anchor="middle">数据流 / 控制流</text>

  <!-- L1 数据接入层 -->
  <rect x="60" y="60" width="660" height="78" rx="10" fill="#EEF3FF" stroke="#2F6BFF"/>
  <text x="78" y="84" font-size="13.5" font-weight="700" fill="#1F3A8A">① 数据接入层</text>
  <text x="78" y="104" font-size="11.5" fill="#33415C">HIS 出院事件 / 名单 · 只读接口 · 院内脱敏</text>
  <text x="78" y="124" font-size="11.5" fill="#33415C">名单同步 · 脱敏 · 统一随访 ID（住院号+出院时间）</text>

  <!-- L2 AI 能力层 -->
  <rect x="60" y="158" width="660" height="96" rx="10" fill="#EEF3FF" stroke="#2F6BFF"/>
  <text x="78" y="180" font-size="13.5" font-weight="700" fill="#1F3A8A">② AI 能力层（院内私有化）</text>
  <g font-size="11.5" fill="#1F2329">
    <rect x="78" y="190" width="150" height="46" rx="6" fill="#fff" stroke="#9DB4F0"/><text x="153" y="217" text-anchor="middle">私有化 LLM</text>
    <rect x="240" y="190" width="120" height="46" rx="6" fill="#fff" stroke="#9DB4F0"/><text x="300" y="217" text-anchor="middle">ASR 识别</text>
    <rect x="372" y="190" width="120" height="46" rx="6" fill="#fff" stroke="#9DB4F0"/><text x="432" y="217" text-anchor="middle">TTS 合成</text>
    <rect x="504" y="190" width="200" height="46" rx="6" fill="#fff" stroke="#9DB4F0"/><text x="604" y="217" text-anchor="middle">红旗规则引擎</text>
  </g>

  <!-- L3 业务应用层 -->
  <rect x="60" y="274" width="660" height="150" rx="10" fill="#EEF3FF" stroke="#2F6BFF"/>
  <text x="78" y="296" font-size="13.5" font-weight="700" fill="#1F3A8A">③ 业务应用层（随访主流程）</text>
  <g font-size="11.5" fill="#1F2329">
    <rect x="78" y="306" width="150" height="44" rx="6" fill="#fff" stroke="#9DB4F0"/><text x="153" y="333" text-anchor="middle">排程与分组</text>
    <rect x="240" y="306" width="150" height="44" rx="6" fill="#fff" stroke="#9DB4F0"/><text x="315" y="333" text-anchor="middle">多渠道触达</text>
    <rect x="402" y="306" width="150" height="44" rx="6" fill="#fff" stroke="#9DB4F0"/><text x="477" y="333" text-anchor="middle">AI 语音问卷</text>
    <rect x="78" y="360" width="150" height="44" rx="6" fill="#fff" stroke="#9DB4F0"/><text x="153" y="387" text-anchor="middle">记录生成</text>
    <rect x="240" y="360" width="150" height="44" rx="6" fill="#fff" stroke="#9DB4F0"/><text x="315" y="387" text-anchor="middle">红旗升级</text>
    <rect x="402" y="360" width="150" height="44" rx="6" fill="#fff" stroke="#9DB4F0"/><text x="477" y="387" text-anchor="middle">归档留存</text>
  </g>

  <!-- L4 合规与安全层 -->
  <rect x="60" y="444" width="660" height="96" rx="10" fill="#EEF3FF" stroke="#2F6BFF"/>
  <text x="78" y="466" font-size="13.5" font-weight="700" fill="#1F3A8A">④ 合规与安全层（护栏 + 审计）</text>
  <g font-size="11.5" fill="#1F2329">
    <rect x="78" y="476" width="150" height="44" rx="6" fill="#fff" stroke="#9DB4F0"/><text x="153" y="503" text-anchor="middle">授权映射</text>
    <rect x="240" y="476" width="150" height="44" rx="6" fill="#fff" stroke="#9DB4F0"/><text x="315" y="503" text-anchor="middle">审计留痕</text>
    <rect x="402" y="476" width="150" height="44" rx="6" fill="#fff" stroke="#9DB4F0"/><text x="477" y="503" text-anchor="middle">最小必要</text>
    <rect x="564" y="476" width="140" height="44" rx="6" fill="#fff" stroke="#9DB4F0"/><text x="634" y="503" text-anchor="middle">90 天删除</text>
  </g>

  <!-- 人工协同层 (right) -->
  <rect x="740" y="158" width="210" height="382" rx="10" fill="#E6F7EF" stroke="#1FA971"/>
  <text x="758" y="182" font-size="13.5" font-weight="700" fill="#176B47">人工协同层</text>
  <text x="758" y="200" font-size="11" fill="#1F7A52">硬关卡 · 不可自动化</text>
  <g font-size="11.5" fill="#1F2329">
    <rect x="758" y="214" width="174" height="60" rx="6" fill="#fff" stroke="#7FD1A8"/>
    <text x="845" y="238" text-anchor="middle" font-weight="600">护士确认</text>
    <text x="845" y="258" text-anchor="middle" font-size="10.5" fill="#5A6573">排程 / 记录覆盖前</text>
    <rect x="758" y="292" width="174" height="60" rx="6" fill="#fff" stroke="#7FD1A8"/>
    <text x="845" y="316" text-anchor="middle" font-weight="600">专科升级</text>
    <text x="845" y="336" text-anchor="middle" font-size="10.5" fill="#5A6573">红旗 / 专科处置</text>
    <rect x="758" y="370" width="174" height="60" rx="6" fill="#fff" stroke="#7FD1A8"/>
    <text x="845" y="394" text-anchor="middle" font-weight="600">质控审核</text>
    <text x="845" y="414" text-anchor="middle" font-size="10.5" fill="#5A6573">归档 / 删除确认</text>
    <rect x="758" y="448" width="174" height="60" rx="6" fill="#fff" stroke="#7FD1A8"/>
    <text x="845" y="472" text-anchor="middle" font-weight="600">身份补录</text>
    <text x="845" y="492" text-anchor="middle" font-size="10.5" fill="#5A6573">授权缺失修复</text>
  </g>
  <!-- connectors human to layers -->
  <g stroke="#1FA971" stroke-width="1.4" fill="none" stroke-dasharray="4 3">
    <line x1="740" y1="244" x2="720" y2="244"/>
    <line x1="740" y1="322" x2="720" y2="322"/>
    <line x1="740" y1="400" x2="720" y2="400"/>
    <line x1="740" y1="478" x2="720" y2="478"/>
  </g>

  <!-- 运营度量层 (bottom) -->
  <rect x="60" y="560" width="890" height="80" rx="10" fill="#FFF3E6" stroke="#E08A2B"/>
  <text x="78" y="584" font-size="13.5" font-weight="700" fill="#9A5A12">⑤ 运营度量层（效果结算 · 对齐「效果浮动」报价）</text>
  <g font-size="11.5" fill="#1F2329">
    <rect x="78" y="596" width="200" height="32" rx="6" fill="#fff" stroke="#F0C089"/><text x="178" y="617" text-anchor="middle">7天完成率 61%→85%</text>
    <rect x="296" y="596" width="170" height="32" rx="6" fill="#fff" stroke="#F0C089"/><text x="381" y="617" text-anchor="middle">单通工时 / 重复填写</text>
    <rect x="484" y="596" width="160" height="32" rx="6" fill="#fff" stroke="#F0C089"/><text x="564" y="617" text-anchor="middle">红旗漏报率</text>
    <rect x="652" y="596" width="150" height="32" rx="6" fill="#fff" stroke="#F0C089"/><text x="727" y="617" text-anchor="middle">效果浮动结算</text>
    <rect x="810" y="596" width="120" height="32" rx="6" fill="#fff" stroke="#F0C089"/><text x="870" y="617" text-anchor="middle">回退人工</text>
  </g>
</svg>
</div></body></html>
